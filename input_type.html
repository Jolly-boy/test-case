    <h1>All Input Types In HTML</h1>
    <form action="">
        <label for="">Enter your name: </label>
        <input type="text" placeholder="Enter your first name">
        <input type="text" placeholder="Enter your last name">
        <br><br>
        <label for="">Enter your email: </label>
        <input type="email" placeholder="Enter your email">
        <br><br>
        <label for="">Enter your FAX number: </label>
        <input type="number" placeholder="Enter your FAX number">
        <br><br>
        <label for="">Select date of birth: </label>
        <input type="date" placeholder="">
        <label for="">Select month</label>
        <input type="month">
        <label for="">Select time</label>
        <input type="time">
        <label for="">Date and Time</label>
        <input type="datetime-local">
        <br><br>
        <label for="">Selcet city</label>
        <input type="checkbox">Mumbai
        <input type="checkbox">Nashik
        <input type="checkbox">Pune
        <br><br>
        <!-- name attribute is important in radio tag to allow select only option -->
        <label for="">Selcet your gender</label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">others
        <br><br>
        <label for="">Select color</label>
        <input type="color">
        <br><br>
        <label for="">Select range</label>
        <input type="range">
        <br><br>
        <label for="">Upload Docs</label>
        <input type="file" multiple>
        <br><br>
        <label for="">Enter your password: </label>
        <input type="password" placeholder="Enter your password">
        <br><br>
        <label for="">Enter URl</label>
        <input type="url">
        <br><br>
        <!-- special tag for phone number -->
        <label for="">Enter your phone number</label>
        <input type="tel" placeholder="Enter your phone number">
        <br><br>
        <label for="">Select country</label>
        <select name="" id="">
            <option value="">India</option>
            <option value="">America</option>
            <option value="">Japan</option>
        </select>
        <br><br>
        <label for="">Enter your adress</label><br>
        <textarea rows="10" cols="30" id=""></textarea>
        <br><br>
        <input type="submit" value="submit">
        <input type="button" value="submit">
        <input type="reset" value="reset">
    </form>
